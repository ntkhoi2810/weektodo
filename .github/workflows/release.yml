name: Build Windows installer

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Yarn
        run: npm install --global yarn@1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build NSIS installer
        run: yarn electron:build --win nsis --publish never
        env:
          VUE_APP_SENTRY_DNS: ${{ secrets.VUE_APP_SENTRY_DNS }}

      - name: Upload installer to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: WeekToDo-Windows-installer
          path: dist_electron/*.exe
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: dist_electron/*.exe
